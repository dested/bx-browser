<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskBox</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #2563eb;
        --danger: #b91c1c;
      }
      body.dark {
        --bg: #111418;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --line: #2a2f36;
        --accent: #6ea8fe;
        --danger: #f87171;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 20px;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
      }
      nav a {
        color: var(--accent);
        text-decoration: none;
      }
      nav button {
        margin-left: auto;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
      }
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        margin-bottom: 12px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      button {
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--fg);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 16px 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      li span {
        flex: 1;
      }
      [role="alert"] {
        color: var(--danger);
        margin-bottom: 12px;
      }
      [data-testid="toast"] {
        margin-top: 16px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div id="nav"></div>
    <main id="view"></main>
    <script>
      const AUTH_KEY = "taskbox.auth";
      const TASKS_KEY = "taskbox.tasks";
      const DARK_KEY = "taskbox.dark";

      const authed = () => localStorage.getItem(AUTH_KEY) === "1";
      const tasks = () => JSON.parse(localStorage.getItem(TASKS_KEY) || "[]");
      const saveTasks = (list) => localStorage.setItem(TASKS_KEY, JSON.stringify(list));

      const view = document.getElementById("view");
      const navHost = document.getElementById("nav");

      function renderNav() {
        if (!authed()) {
          navHost.innerHTML = "";
          return;
        }
        navHost.innerHTML = `
          <nav>
            <a href="#/tasks">Tasks</a>
            <a href="#/settings">Settings</a>
            <a href="#/game">Game</a>
            <button class="secondary" data-testid="sign-out">Sign out</button>
          </nav>`;
        navHost.querySelector('[data-testid="sign-out"]').addEventListener("click", () => {
          localStorage.removeItem(AUTH_KEY);
          location.hash = "#/login";
        });
      }

      function renderLogin() {
        view.innerHTML = `
          <h1>TaskBox</h1>
          <div data-testid="login-form">
            <label for="email">Email</label>
            <input id="email" data-testid="email" type="email" placeholder="Email" />
            <label for="password">Password</label>
            <input id="password" data-testid="password" type="password" placeholder="Password" />
            <button data-testid="sign-in">Sign in</button>
          </div>`;
        view.querySelector('[data-testid="sign-in"]').addEventListener("click", () => {
          const email = view.querySelector('[data-testid="email"]').value.trim();
          const password = view.querySelector('[data-testid="password"]').value;
          if (email === "demo@taskbox.test" && password === "hunter2") {
            localStorage.setItem(AUTH_KEY, "1");
            location.hash = "#/tasks";
            return;
          }
          if (!view.querySelector('[data-testid="login-error"]')) {
            const err = document.createElement("div");
            err.setAttribute("role", "alert");
            err.dataset.testid = "login-error";
            err.textContent = "Invalid credentials";
            view.querySelector('[data-testid="login-form"]').prepend(err);
          }
        });
      }

      function renderTasks() {
        view.innerHTML = `
          <h1>Tasks</h1>
          <div class="row">
            <input id="new-task" data-testid="new-task" type="text" placeholder="What needs doing?" />
            <button data-testid="add-task">Add task</button>
          </div>
          <ul data-testid="task-list"></ul>
          <div class="row">
            <button class="secondary" data-testid="load-widget">Load slow widget</button>
            <button class="secondary" data-testid="trigger-error">Trigger error</button>
          </div>
          <div id="widget-slot"></div>`;

        const list = view.querySelector('[data-testid="task-list"]');
        const input = view.querySelector('[data-testid="new-task"]');

        function paint() {
          list.innerHTML = "";
          for (const [i, task] of tasks().entries()) {
            const li = document.createElement("li");
            const span = document.createElement("span");
            span.textContent = task;
            const del = document.createElement("button");
            del.className = "secondary";
            del.textContent = "Delete";
            del.setAttribute("aria-label", `Delete ${task}`);
            del.addEventListener("click", () => {
              const next = tasks();
              next.splice(i, 1);
              saveTasks(next);
              paint();
            });
            li.append(span, del);
            list.append(li);
          }
        }

        function add() {
          const value = input.value.trim();
          if (!value) return;
          saveTasks([...tasks(), value]);
          input.value = "";
          paint();
        }

        view.querySelector('[data-testid="add-task"]').addEventListener("click", add);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") add();
        });

        view.querySelector('[data-testid="load-widget"]').addEventListener("click", () => {
          setTimeout(() => {
            const slot = view.querySelector("#widget-slot");
            if (!slot || slot.querySelector('[data-testid="widget"]')) return;
            const widget = document.createElement("div");
            widget.dataset.testid = "widget";
            widget.textContent = "Widget loaded";
            slot.append(widget);
          }, 1500);
        });

        view.querySelector('[data-testid="trigger-error"]').addEventListener("click", () => {
          console.error("TaskBox: simulated failure");
          fetch("/fixture/missing.json").catch(() => {});
        });

        paint();
      }

      function renderSettings() {
        const dark = localStorage.getItem(DARK_KEY) === "1";
        view.innerHTML = `
          <h1>Settings</h1>
          <div class="row">
            <input id="dark-mode" data-testid="dark-mode" type="checkbox" ${dark ? "checked" : ""} />
            <label for="dark-mode">Dark mode</label>
            <span data-testid="dark-status">Dark mode ${dark ? "on" : "off"}</span>
          </div>
          <button data-testid="save-settings">Save</button>
          <div id="toast-slot"></div>`;

        const checkbox = view.querySelector('[data-testid="dark-mode"]');
        checkbox.addEventListener("change", () => {
          document.body.classList.toggle("dark", checkbox.checked);
          localStorage.setItem(DARK_KEY, checkbox.checked ? "1" : "0");
          view.querySelector('[data-testid="dark-status"]').textContent =
            `Dark mode ${checkbox.checked ? "on" : "off"}`;
        });

        view.querySelector('[data-testid="save-settings"]').addEventListener("click", () => {
          const slot = view.querySelector("#toast-slot");
          if (slot.querySelector('[data-testid="toast"]')) return;
          const toast = document.createElement("div");
          toast.dataset.testid = "toast";
          toast.textContent = "Saved";
          slot.append(toast);
          setTimeout(() => toast.remove(), 2000);
        });
      }

      // A canvas view: nothing here is addressable as DOM, so it is only
      // reachable through the coordinate verbs (mouse, drag, key).
      function renderGame() {
        view.innerHTML = `
          <h1>Game</h1>
          <canvas id="game" data-testid="game-canvas" width="400" height="300"></canvas>
          <p data-testid="game-hint">Click to drop a target, drag the square, w/a/s/d or arrows to move.</p>`;

        const canvas = view.querySelector("#game");
        const ctx = canvas.getContext("2d");
        const state = { player: { x: 50, y: 50 }, targets: [], keys: {} };
        // Live object: tests read positions straight off it via bx js.
        window.__game = state;

        const MOVE_KEYS = ["w", "a", "s", "d", "arrowup", "arrowleft", "arrowdown", "arrowright"];
        const clamp = (n, max) => Math.max(0, Math.min(max, n));
        const at = (e) => {
          const r = canvas.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        };

        let dragging = false;
        let dragged = false;

        canvas.addEventListener("mousedown", (e) => {
          const p = at(e);
          if (Math.hypot(p.x - state.player.x, p.y - state.player.y) <= 15) {
            dragging = true;
            dragged = true;
          }
        });
        canvas.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          const p = at(e);
          state.player.x = clamp(p.x, canvas.width);
          state.player.y = clamp(p.y, canvas.height);
        });
        canvas.addEventListener("mouseup", () => {
          dragging = false;
        });
        canvas.addEventListener("click", (e) => {
          // A drag ends with a click event too; that one is not a new target.
          if (dragged) {
            dragged = false;
            return;
          }
          state.targets.push(at(e));
        });

        // Held keys drive the loop below. Both listeners retire themselves once
        // another view has taken over, so navigating away stops the game.
        function onKey(e) {
          if (window.__game !== state) {
            window.removeEventListener("keydown", onKey);
            window.removeEventListener("keyup", onKey);
            return;
          }
          const k = e.key.toLowerCase();
          if (!MOVE_KEYS.includes(k)) return;
          state.keys[k] = e.type === "keydown";
          e.preventDefault();
        }
        window.addEventListener("keydown", onKey);
        window.addEventListener("keyup", onKey);

        function frame() {
          if (window.__game !== state) return;
          const k = state.keys;
          const dx = (k.a || k.arrowleft ? -1 : 0) + (k.d || k.arrowright ? 1 : 0);
          const dy = (k.w || k.arrowup ? -1 : 0) + (k.s || k.arrowdown ? 1 : 0);
          state.player.x = clamp(state.player.x + dx * 2, canvas.width);
          state.player.y = clamp(state.player.y + dy * 2, canvas.height);

          ctx.fillStyle = "#111418";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#6ea8fe";
          for (const t of state.targets) {
            ctx.beginPath();
            ctx.arc(t.x, t.y, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = "#f5c451";
          ctx.fillRect(state.player.x - 8, state.player.y - 8, 16, 16);
          requestAnimationFrame(frame);
        }
        frame();
      }

      function render() {
        document.body.classList.toggle("dark", localStorage.getItem(DARK_KEY) === "1");
        const route = location.hash || (authed() ? "#/tasks" : "#/login");
        if (!authed() && route !== "#/login") {
          location.hash = "#/login";
          return;
        }
        renderNav();
        if (route === "#/tasks") renderTasks();
        else if (route === "#/settings") renderSettings();
        else if (route === "#/game") renderGame();
        else renderLogin();
      }

      window.addEventListener("hashchange", render);
      render();
    </script>
  </body>
</html>
